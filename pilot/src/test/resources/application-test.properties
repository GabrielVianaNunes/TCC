spring.application.name=pilot

spring.datasource.url=jdbc:postgresql://localhost:5432/senai_zeiss_test
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Chave fixa só para teste — nunca usar em ambiente real. Necessária porque
# CryptoConverter é aplicado a todo Servico com CPF/CNPJ ou endereço.
security.field-encryption-key=DrDXdGMBVgHpUu+Doij1Ag0rYMJpxVQ2ahGe77wEfvI=

# Sem isso, o Hibernate valida a entidade Usuario de novo sozinho a cada
# flush (Bean Validation da Fase 2) — quebra o AdminInitializer, que cria o
# admin de bootstrap com cargo=null de propósito. CI não tem
# application.properties (gitignorado, não existe em um checkout limpo),
# então essa propriedade PRECISA estar aqui, não só no arquivo real.
spring.jpa.properties.jakarta.persistence.validation.mode=none
