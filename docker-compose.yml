services:
  app:
    build:
      context: ./pilot
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-senai_zeiss}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      SERVER_PORT: 8090
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON: ${BACKUP_CRON:-0 0 3 * * *}
      # FO-307 da GETIN: a cópia de backup enviada ao S3 precisa ser
      # criptografada. Sem essa chave (32 bytes em Base64), o backup falha
      # em vez de subir sem criptografia. Gerar com: openssl rand -base64 32
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # FO-307/FO-358 da GETIN: CPF/CNPJ e endereço em servicos precisam ser
      # criptografados no banco. Obrigatória — sem ela, o app sobe mas
      # qualquer operação com esses campos falha. Gerar com:
      # openssl rand -base64 32
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?defina FIELD_ENCRYPTION_KEY no .env}
      # Endurecimento de produção (ver CONTRIBUTING.md > Checklist de produção):
      # cache de template ligado, log de segurança sem detalhe de DEBUG.
      THYMELEAF_CACHE: "true"
      LOG_LEVEL_SECURITY: WARN
      # Caddy termina TLS na frente do app; o cookie de sessão só deve ser
      # enviado por HTTPS (FO-358 da GETIN).
      SESSION_COOKIE_SECURE: "true"
      # Caminho Linux com volume nomeado — os defaults dos serviços (C:/PDFs)
      # são only para desenvolvimento local no Windows. Sem essa variável,
      # documentos anexados (certificados, laudos) seriam gravados num
      # caminho relativo dentro do contêiner e perdidos no próximo redeploy.
      STORAGE_PDF_PATH: /data/pdfs
    volumes:
      - pdf_data:/data/pdfs
    expose:
      - "8090"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-senai_zeiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  pdf_data:
  caddy_data:
  caddy_config:
